# Checks the registry files a pull request adds or changes and writes the result to the
# check summary. Runs with a read-only token: the pull request's files are only read as data.
name: Check registration

on:
  pull_request:
    paths:
      - "registry/**"

permissions:
  contents: read
  pull-requests: write

env:
  # Keep these four the same as in build.yml.
  BUILDER_REPO: Gamiseus/QuarterMaster
  BUILDER_TAG: qm-site-builder-v1.1.0
  BUILDER_ASSET: qm-site-builder.exe
  BUILDER_SHA256: c4824ecbd1252260c7a577b86d09826c69bb5cf72b2210954e863ffc96756c61

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the builder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:BUILDER_TAG --repo $env:BUILDER_REPO --pattern $env:BUILDER_ASSET --dir builder
          $hash = (Get-FileHash "builder/$env:BUILDER_ASSET" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:BUILDER_SHA256.ToLower()) { throw "Builder SHA-256 is $hash, expected $env:BUILDER_SHA256" }

      - name: Check
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $files = git diff --name-only --diff-filter=AM "$env:BASE_SHA...HEAD" -- "registry/*.toml"
          if (-not $files) { "No registry files changed." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $failed = $false
          foreach ($f in $files) {
            & "./builder/$env:BUILDER_ASSET" check-registration $f --summary $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
